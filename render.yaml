# Render Blueprint: New > Blueprint > choose this repository.
# Free plan: the site sleeps when idle and the database is reset when the service restarts.
# For permanent data: change plan to "starter" and add back:
#    disk:
#      name: data
#      mountPath: /app/data
#      sizeGB: 1
services:
  - type: web
    name: missionpilot-ai
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS_ONLY
        value: "1"
      - key: ANTHROPIC_API_KEY   # optional — turns on Claude AI writing
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
