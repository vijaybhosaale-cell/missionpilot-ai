# Render Blueprint: New > Blueprint > choose this repository.
# Free plan: the site sleeps when idle and the database is reset when the service restarts.
# For permanent data: change plan to "starter" and add back:
#    disk:
#      name: data
#      mountPath: /app/data
#      sizeGB: 1
services:
  - type: web
    name: missionpilot-ai
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS_ONLY
        value: "1"
      - key: ANTHROPIC_API_KEY   # optional — turns on Claude AI writing
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: SMTP_USER          # Gmail address that sends the e-mails
        sync: false
      - key: SMTP_PASSWORD      # Gmail App password (16 characters), never the normal password
        sync: false
      - key: EMAIL_TO           # receives demo-workspace e-mails and admin copies
        sync: false
      - key: CRON_SECRET        # optional: protects /api/cron/* (put the same value in GitHub secret MP_CRON_SECRET)
        sync: false
